[tool.poetry]
name = "vdr-agent"
version = "0.1.0"
description = "VDR Agent Service — AI summary and fitment pipeline"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = ">=0.115,<1.0"
uvicorn = {extras = ["standard"], version = ">=0.30,<1.0"}
pydantic = ">=2.0,<3.0"
pydantic-settings = ">=2.0,<3.0"
psycopg = {extras = ["binary"], version = "==3.3.3"}
psycopg-pool = ">=3.2,<4.0"
boto3 = ">=1.28,<2.0"
python-dotenv = ">=1.0,<2.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4,<9.0"
pytest-asyncio = ">=0.21,<1.0"
black = ">=23.0,<25.0"
ruff = ">=0.1,<1.0"
mypy = ">=1.5,<2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
